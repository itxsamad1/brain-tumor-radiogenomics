[project]
name = "btlab"
version = "0.1.0"
description = "Leakage-free glioma MRI radiogenomics research toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "itxsamad1" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "rich>=13.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[project.optional-dependencies]
# Heavy / GPU stacks — install when needed
torch = [
  "torch>=2.4",
  "torchvision>=0.19",
]
medical = [
  "SimpleITK>=2.3",
  "nibabel>=5.2",
  "monai>=1.3",
]
radiomics = [
  "pyradiomics>=3.1",
]
survival = [
  "scikit-survival>=0.23",
]
tabular = [
  "xgboost>=2.0",
  "tabpfn>=2.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "ipykernel>=6.29",
]
all = [
  "btlab[torch,medical,radiomics,survival,tabular,dev]",
]

[project.scripts]
btlab = "btlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btlab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
